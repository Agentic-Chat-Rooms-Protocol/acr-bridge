version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmpass
      POSTGRES_DB: mattermost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
      - "8443:8443"
    environment:
      # Database
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmpass@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"

      # Site URL
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"

      # Bot & token support
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"

      # Allow local mode API for initial setup
      MM_SERVICESETTINGS_ENABLELOCALMODE: "false"

      # Disable email verification for testing
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"

      # Disable rate limiting for testing
      MM_RATELIMITSETTINGS_ENABLE: "false"

      # Enable WebSocket for adapter testing
      MM_SERVICESETTINGS_ENABLEINSECUREOUTGOINGCONNECTIONS: "true"

      # Enable file uploads
      MM_FILESETTINGS_MAXFILESIZE: "52428800"

      # Relaxed password policy for test accounts
      MM_PASSWORDSETTINGS_MINIMUMLENGTH: "5"
      MM_PASSWORDSETTINGS_LOWERCASE: "false"
      MM_PASSWORDSETTINGS_UPPERCASE: "false"
      MM_PASSWORDSETTINGS_NUMBER: "false"
      MM_PASSWORDSETTINGS_SYMBOL: "false"

      # Team settings
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_TEAMSETTINGS_MAXUSERSPERTEAM: "50"

      # Plugin settings (disable marketplace to speed up boot)
      MM_PLUGINSETTINGS_ENABLEMARKETPLACE: "false"

      # Log settings
      MM_LOGSETTINGS_CONSOLELEVEL: "INFO"
      MM_LOGSETTINGS_ENABLEFILE: "false"
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_config:/mattermost/config
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/api/v4/system/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  mattermost_data:
  mattermost_logs:
  mattermost_config:
  mattermost_plugins:
  mattermost_client_plugins:
